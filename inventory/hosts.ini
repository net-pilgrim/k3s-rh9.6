# Inventory for k3s cluster hosting Forgejo, Runners, Plane & It's a Plan
[server]
k3s-master ansible_host=YOUR_SERVER_IP ansible_user=root # ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Optional worker nodes: uncomment and populate if building a multi-node cluster
[agents]
# k3s-worker-1 ansible_host=YOUR_WORKER_1_IP ansible_user=root
# k3s-worker-2 ansible_host=YOUR_WORKER_2_IP ansible_user=root

[k3s_cluster:children]
server
agents

[k3s_cluster:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_extra_args='-o StrictHostKeyChecking=no'
