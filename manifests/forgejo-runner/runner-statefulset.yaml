apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app: forgejo-runner
spec:
  replicas: 1
  serviceName: forgejo-runner
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      containers:
        # Docker-in-Docker sidecar for executing container actions
        - name: dind
          image: docker:27-dind
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: dind-storage
              mountPath: /var/lib/docker

        # Forgejo Runner daemon container
        - name: runner
          image: code.forgejo.org/forgejo/runner:4.0.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Docker daemon to become responsive..."
              while ! docker info >/dev/null 2>&1; do
                sleep 2
              done
              echo "Docker daemon is ready!"

              if [ ! -f /data/.runner ]; then
                echo "Registering runner with Forgejo at ${FORGEJO_INSTANCE_URL}..."
                if [ -z "${RUNNER_TOKEN}" ]; then
                  echo "ERROR: RUNNER_TOKEN is empty! Please register the runner or populate the secret."
                  sleep 30
                  exit 1
                fi
                forgejo-runner register \
                  --no-interactive \
                  --instance "${FORGEJO_INSTANCE_URL}" \
                  --token "${RUNNER_TOKEN}" \
                  --name "${RUNNER_NAME}" \
                  --labels "ubuntu-latest:docker://node:20-bookworm,ubuntu-22.04:docker://node:20-bookworm,docker:docker://docker:27-cli"
                echo "Runner successfully registered!"
              else
                echo "Found existing runner registration in /data/.runner"
              fi

              echo "Starting forgejo-runner daemon..."
              exec forgejo-runner daemon --config /etc/forgejo-runner/config.yaml
          env:
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: FORGEJO_INSTANCE_URL
              value: "http://forgejo-http.forgejo.svc.cluster.local:3000"
            - name: RUNNER_NAME
              value: "k3s-dind-runner"
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: token
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/forgejo-runner/config.yaml
              subPath: config.yaml
      volumes:
        - name: docker-socket
          emptyDir: {}
        - name: runner-config
          configMap:
            name: forgejo-runner-config
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: dind-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 20Gi
