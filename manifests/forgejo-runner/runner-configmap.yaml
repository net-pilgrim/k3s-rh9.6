apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 2
      timeout: 3h
      insecure: true
      fetch_timeout: 5s
      fetch_interval: 2s
      labels:
        - "ubuntu-latest:docker://node:20-bookworm"
        - "ubuntu-22.04:docker://node:20-bookworm"
        - "ubuntu-20.04:docker://node:20-bookworm"
        - "docker:docker://docker:27-cli"
    cache:
      enabled: true
      dir: /data/cache
    container:
      network: "host"
      privileged: true
      docker_host: "tcp://127.0.0.1:2375"
